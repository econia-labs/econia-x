# cspell:word amannn
---
jobs:
  job-status:
    name: 'Semantic PR'
    needs:
    - 'merge-group'
    - 'pr-title'
    runs-on: 'ubuntu-latest'
    steps:
    - run: 'echo "Semantic PR workflow successfully completed"'
  merge-group:
    if: 'github.event_name == ''merge_group'''
    runs-on: 'ubuntu-latest'
    steps:
    - run: 'echo "PR title check skipped in merge group"'
  pr-title:
    environment: 'alpha'
    if: 'github.event_name != ''merge_group'''
    runs-on: 'ubuntu-latest'
    steps:
    - env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      uses: 'amannn/action-semantic-pull-request@v5'
      with:
        requireScope: true
        scopes: '^ECO-[0-9]+$'
        subjectPattern: '^[A-Z].*$'
        validateSingleCommit: true
        validateSingleCommitMatchesPrTitle: true
'on':
  merge_group: null
  pull_request:
    types:
    - 'edited'
    - 'opened'
    - 'reopened'
    - 'synchronize'
permissions:
  contents: 'read'
  pull-requests: 'read'
  statuses: 'read'
...
