---
jobs:
  approval:
    # Require explicit approval via the `pull-request` environment unless
    # triggered in a merge queue.
    environment: |
      ${{ github.event_name != 'merge_group' && 'pull-request' || '' }}
    name: 'Approval'
    runs-on: 'ubuntu-latest'
    steps:
    - run: 'echo "Workflow approved"'
  pre-commit:
    # Run in a merge group, for default pull request events, or when manually
    # triggered by a comment.
    if: |
      github.event_name == 'merge_group' || (
      github.event_name == 'pull_request' && (
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize')) || (
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/housekeeping' &&
      github.event.issue.number == github.event.pull_request.number)
    needs:
    - 'approval'
    uses: './.github/workflows/pre-commit.yaml'
  semantic-pr:
    name: 'Semantic PR'
    needs:
    - 'approval'
    secrets: 'inherit'
    # Run for all events, since an inner step requires event context.
    uses: './.github/workflows/semantic-pr.yaml'
name: 'Housekeeping'
'on':
  merge_group: null
  pull_request:
    types:
    - 'edited'
    - 'opened'
    - 'reopened'
    - 'synchronize'
  issue_comment:
    types:
    - 'created'
permissions:
  contents: 'read'
  pull-requests: 'read'
...
