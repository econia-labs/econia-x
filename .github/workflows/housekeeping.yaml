---
jobs:
  approval:
    # Require explicit approval via the `pull-request` environment unless
    # triggered in a merge queue.
    environment: |
      ${{ github.event_name != 'merge_group' && 'pull-request' || '' }}
    name: 'Approval'
    runs-on: 'ubuntu-latest'
    steps:
    - run: 'echo "Workflow approved"'
  pre-commit:
    needs:
    - 'approval'
    uses: './.github/workflows/pre-commit.yaml'
  semantic-pr:
    name: 'Semantic PR'
    needs:
    - 'approval'
    secrets: 'inherit'
    uses: './.github/workflows/semantic-pr.yaml'
name: 'Housekeeping'
'on':
  merge_group: null
  pull_request:
    types:
    - 'edited'
    - 'opened'
    - 'reopened'
    - 'synchronize'
permissions:
  contents: 'read'
  pull-requests: 'read'
...
