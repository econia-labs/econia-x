---
env:
  AWS_ACCOUNT_ID: '123456'
  AWS_REGION: 'us-west-2'
  BUILD_CONTEXT: 'aptos-node/fullnode-init'
  ECR_REPO: '${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION
            }}.amazonaws.com/aptos-node/fullnode-init'
  GIT_TAG_PREFIX: 'fullnode-init'
jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v4'
    - uses: 'docker/setup-buildx-action@v3'
    - id: 'metadata'
    - uses: 'docker/metadata-action@v5'
      with:
        flavor: 'latest=false'
        images: '${{ env.ECR_REPO }}'
        tags: 'type=match,pattern=${{ env.GIT_TAG_PREFIX }}-v(.*),group=1'
    - run: 'echo ${{ steps.meta.outputs.tags }}'
    - id: 'build'
      uses: 'docker/build-push-action@v6'
      with:
        push: 'true'
        context: '${{ env.BUILD_CONTEXT }}'
        outputs: 'name=${{ env.ECR_REPO }},push=true'
        load: 'true'
name: 'Push fullnode init image to ECR'
'on':
  push:
    tags:
    - 'fullnode-init-v*'