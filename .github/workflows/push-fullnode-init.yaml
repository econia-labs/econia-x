# cspell:word buildx
---
env:
  BUILD_CONTEXT: 'aptos-node/fullnode-init'
  ECR_REPO: 'aptos-node/fullnode-init'
  GIT_TAG_PREFIX: 'fullnode-init'
jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'aws-actions/configure-aws-credentials@v4'
      with:
        aws-region: '${{ vars.AWS_REGION }}'
        role-to-assume: '${{ vars.AWS_GITHUB_ACTIONS_ROLE }}'
    - uses: 'aws-actions/amazon-ecr-login@v2'
    - uses: 'actions/checkout@v4'
    - uses: 'docker/setup-buildx-action@v3'
    - id: 'metadata'
      uses: 'docker/metadata-action@v5'
      with:
        flavor: 'latest=false'
        tags: 'type=match,pattern=${{ env.GIT_TAG_PREFIX }}-v(.*),group=1'
    - run: 'echo ${{ steps.metadata.outputs.tags }}'
    - id: 'build'
      uses: 'docker/build-push-action@v6'
      with:
        context: '${{ env.BUILD_CONTEXT }}'
        load: 'true'
        push: 'false'
    - env:
        AWS_ACCOUNT_ID: '${{ vars.AWS_ACCOUNT_ID }}'
        AWS_REGION: '${{ vars.AWS_REGION }}'
        ECR_REPO: '${{ env.ECR_REPO }}'
        IMAGE_ID: '${{ steps.build.outputs.imageid }}'
        TAGS: '${{ steps.metadata.outputs.tags }}'
      run: 'sh push-fullnode-init.sh'
      working-directory: '${{ github.workspace }}/.github/workflows/sh'
name: 'Push fullnode init image to ECR'
'on':
  push:
    tags:
    - 'fullnode-init-v*'
permissions:
  contents: 'read'
  id-token: 'write'
...
