---
jobs:
  stub:
    name: 'pre-commit'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        cache: 'pip'
        python-version: '3.13'
    - run: 'pip install pre-commit'
    - run: 'pre-commit --version'
name: 'pre-commit'
'on':
  merge_group: null
  pull_request: null
...
