---
jobs:
  merge_group:
    if: 'github.event_name == ''merge_group'''
    runs-on: 'ubuntu-latest'
    steps:
    - run: 'echo "Approval skipped for merge group"'
  pull_request:
    environment: 'pull-request'
    if: 'github.event_name == ''pull_request'''
    runs-on: 'ubuntu-latest'
    steps:
    - run: 'echo "Manually approved for pull request"'
name: 'Housekeeping approval'
'on':
  merge_group: null
  pull_request:
    types:
    - 'edited'
    - 'opened'
    - 'reopened'
    - 'synchronize'
...
